# schemas/artifacts/operating-reality.yaml
# Default schema for the operating-reality kind.

kind: operating-reality
id_prefix: OR

structural_minimum:
  - name: id
    type: string
    pattern: "^OR-\\d{3,}$"
    required: true
  - name: kind
    type: const
    value: operating-reality
    required: true
  - name: created_at
    type: iso8601
    required: true
  - name: hash
    type: string
    pattern: "^sha256:[0-9a-f]{12,64}$"
    required: true
  - name: confidence
    type: const
    value: validated
    required: true
  - name: reverses
    type: string|null
    pattern: "^OR-\\d{3,}$|^null$"
    required: true
  - name: tags
    type: list[string]
    required: true
    default: [foundation]
  - name: superseded_by
    type: string|null
    required: false

operating_reality_fields:
  - name: budget
    type: object
    required: true
    fields:
      - name: amount
        type: number
        required: true
      - name: currency
        type: string
        pattern: "^[A-Z]{3}$"
        required: true
      - name: frequency
        type: enum
        values: [one-time, weekly, monthly, quarterly, annual]
        required: true
  - name: timeline
    type: object
    required: true
    fields:
      - name: hard_deadline
        type: iso8601-date|null
        required: true
      - name: soft_target
        type: iso8601-date|null
        required: false
  - name: team
    type: object
    required: true
    fields:
      - name: operator
        type: string
        required: true
      - name: role
        type: enum
        values: [solo, lead, contributor]
        required: true
      - name: others
        type: list[string]
        required: false
        default: []
  - name: authority
    type: object
    required: true
    fields:
      - name: can_decide
        type: list[string]
        required: true
      - name: requires_approval
        type: list[string]
        required: true
  - name: operator_profile
    type: string
    required: true
  # v5.1 — both delegation_policy and model_selection_policy are optional. Omitted
  # fields inherit harness defaults; set them to capture operator preferences once
  # at bootstrap so they propagate across sessions. Backwards-compatible: a v5.0.1
  # OR-001 with neither field validates unchanged under v5.1.
  - name: delegation_policy
    type: object
    required: false
    fields:
      - name: mode
        type: enum
        values: [step-by-step, run-to-completion, hybrid]
        required: true
      - name: subagent_use
        type: enum
        values: [never, when-helpful, aggressive]
        required: true
      - name: pause_on
        type: list[string]
        required: true
        # Allowed values (validated by schema): council-failures,
        # layer1-failures-after-N-retries, operator-mid-flow-directives,
        # phase-boundaries, critical-risk-task-completion. Empty list means
        # the agent does not pause for any of these (run-to-completion posture).
      - name: resume_authority
        type: enum
        values: [operator-only, agent-judgment, both]
        required: true
  - name: model_selection_policy
    type: object
    required: false
    fields:
      - name: prefer
        type: enum
        values: [cheapest-capable, fastest-capable, most-capable, manual-only]
        required: true
      - name: fallback_trigger
        type: enum
        values: [layer1-failure-after-N, layer2-failure, council-non-convergence, never]
        required: true
      - name: fallback_target
        type: string|null
        required: true
      - name: per_task_overrides
        type: list[object]
        required: false
        default: []
        item_fields:
          - name: task_kind
            type: string
            required: true
          - name: prefer
            type: enum
            values: [cheapest-capable, fastest-capable, most-capable]
            required: true

body:
  required_sections:
    - "## Why this exists"

render_order:
  - id
  - kind
  - created_at
  - hash
  - confidence
  - reverses
  - superseded_by
  - tags
  - budget
  - timeline
  - team
  - authority
  - operator_profile
  - delegation_policy
  - model_selection_policy
