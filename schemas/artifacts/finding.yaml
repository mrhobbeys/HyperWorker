# schemas/artifacts/finding.yaml
# Default schema for the finding kind.

kind: finding
id_prefix: F

structural_minimum:
  - name: id
    type: string
    pattern: "^F-\\d{3,}$"
    required: true
  - name: kind
    type: const
    value: finding
    required: true
  - name: created_at
    type: iso8601
    required: true
  - name: hash
    type: string
    pattern: "^sha256:[0-9a-f]{12,64}$"
    required: true
  - name: confidence
    type: enum
    values: [provisional, validated]
    default: provisional
    required: true
  - name: reverses
    type: string|null
    pattern: "^F-\\d{3,}$|^null$"
    required: true
  - name: tags
    type: list[string]
    required: true
    default: []
  - name: superseded_by
    type: string|null
    required: false

finding_fields:
  - name: title
    type: string
    required: true
    max_length: 140
  - name: evidence
    type: string
    required: true
    description: "What was measured, by whom, on what date. Cite committed data files where applicable."
  - name: applies_to
    type: string
    required: true
    description: "Scope expression (paths, projects, contexts; supports globs)."
  - name: implications
    type: list[string]
    required: false
    default: []
  # v6.0.0 — exclusion discipline. Optional; used when a finding is carried as a
  # hypothesis under elimination. See core/SUBSTRATE.md §Exclusion Discipline.
  - name: status
    type: enum
    values: [open, suspect, excluded]
    default: open
    required: false
    description: >-
      Hypothesis state. `open` = not investigated. `suspect` = argued for or
      against, including by careful static reading; still live. `excluded` =
      ruled out, and only ever on the strength of a dynamic test named in
      test_ref. A static read can reach `suspect` and no further.
  - name: test_ref
    type: string|null
    default: null
    required: false
    description: >-
      How it was tested. An evidence.capture id (`ED-014`) or a checked-claim
      predicate recorded in the same event's `claim:` block. Required when
      status is `excluded`; Layer 1 check 19 FAILs `excluded_without_test_ref`
      otherwise. Prose reasoning is not a test_ref.

body:
  required_sections:
    - "## What was found"
    - "## How it was found"
    - "## What it implies"

render_order:
  - id
  - kind
  - created_at
  - hash
  - confidence
  - reverses
  - superseded_by
  - tags
  - title
  - evidence
  - applies_to
  - status
  - test_ref
  - implications

exclusion_rule:
  description: >-
    A hypothesis may be marked `status: excluded` only with a test_ref citing a
    dynamic test that exercised the actual code path. Static reads mark
    `suspect`. See core/SUBSTRATE.md §Exclusion Discipline.
  preconditions:
    - "test_ref names an evidence.capture id present in the chain, OR the event carries a claim: block whose predicate was run."
    - "The test exercised the code path the hypothesis is about, not an adjacent one."

promotion_rule:
  description: "`hw promote F-<id>` writes a finding.promote event upgrading confidence to validated."
  preconditions:
    - "Current finding must be confidence: provisional."
    - "All citations in evidence must resolve at Layer 1."
