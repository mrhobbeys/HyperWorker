# schemas/projects/report-synthesis/schema.yaml
# Project schema metadata. Used by `hw bootstrap --schema report-synthesis`.

schema_id: report-synthesis
schema_version: 1.0
harness_version: "6.0.0"
description: |
  Take a corpus of varied-but-related reports (audits, research notes, analyses,
  competitive briefs, interviews) plus operator constraints/goals, and produce
  a single source-of-truth synthesis with citation integrity. Every output claim
  cites a source by hash; every input source is incorporated, contradicted, or
  explicitly discarded with reason. Earlier rounds of corrected work become
  anti-patterns rather than ignored noise.

bootstrap_questions:
  - id: project_name
    prompt: "What is this synthesis called?"
    type: string
    required: true
  - id: synthesis_purpose
    prompt: "One sentence: what is this synthesis FOR? What decision or work will it inform?"
    type: string
    required: true
  - id: target_audience
    prompt: "Who reads the synthesis? (operator only / team / external stakeholder / mixed)"
    type: string
    required: true
  - id: output_format
    prompt: "What shape is the deliverable? (structured-doc / decision-matrix / executive-brief / strategic-foundation / other)"
    type: enum
    values: [structured-doc, decision-matrix, executive-brief, strategic-foundation, other]
    required: true
  - id: input_folder
    prompt: "Where do the source reports live? (path relative to project root, e.g., 'inputs/')"
    type: string
    required: true
  - id: weighting_rule
    prompt: "How should sources be weighted? (default: 'latest-corrected-round-wins; earlier-rounds-feed-anti-patterns'). Override if needed."
    type: string
    required: false
    default: "latest-corrected-round-wins; earlier-rounds-feed-anti-patterns"
  - id: excluded_topics
    prompt: "Anything explicitly out of scope for this synthesis? (list or null)"
    type: list[string]|null
    required: false
  - id: confidence_floor
    prompt: "Minimum confidence for output claims? (provisional accepts unverified findings; validated requires operator promotion)"
    type: enum
    values: [provisional, validated]
    default: provisional
  - id: deliverable_path
    prompt: "Where does the final synthesis output go?"
    type: string
    required: true

includes:
  - precedence-tiers.yaml
  - artifact-extensions.yaml
  - capability-gates.yaml
  - verification.yaml
  - council.yaml
  - project-template.md
  - rules-template.md
  - task-templates/
  - README.md

default_tasks:
  description: |
    Synthesis decomposes into 10 tasks across 4 phases:
    Phase A (Setup): source inventory + charter merge (T-000), purpose-fit corpus scan (T-001)
    Phase B (Extraction): claim extraction + anti-pattern capture
    Phase C (Reconciliation): contradiction scan + resolution
    Phase D (Synthesis): structure + draft + audit + final

    v5.0.1 merged T-001's original "synthesis charter" responsibilities into
    T-000 (Tier 4 STYLE, banned tokens, canonical facts) and left the T-001 slot
    intentionally skipped. v5.1 reuses the T-001 slot for a different purpose:
    a purpose-fit corpus scan that surfaces 2-3 plausible synthesis purposes
    against the actual corpus before T-002 begins. The v5.0 brand-foundation-
    synthesis run's highest-leverage operator intervention was refusing to lock
    OR-002 without seeing what the corpus contained; v5.1 makes that step
    structural so the harness surfaces purpose-vs-corpus mismatches instead of
    requiring the operator to know to push back. T-002's depends_on is updated
    from [T-000] to [T-001] so the corpus scan completes (with operator
    confirmation or supersede) before extraction begins.
  templates:
    - "00-source-inventory.md"
    - "01-corpus-scan.md"
    - "02-claim-extraction.md"
    - "03-anti-pattern-capture.md"
    - "04-contradiction-scan.md"
    - "05-contradiction-resolution.md"
    - "06-synthesis-structure.md"
    - "07-synthesis-draft.md"
    - "08-completeness-audit.md"
    - "09-final-synthesis.md"
