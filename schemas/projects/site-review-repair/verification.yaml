# schemas/projects/site-review-repair/verification.yaml
standard:
  layers: [1, 2]
  retry_budget: 3
  layer2_checks: [acceptance_criteria, scan_compliance, recitation_completeness, banned_token_scan, output_presence]
elevated:
  layers: [1, 2, 3]
  retry_budget: 2
  council_size: 2
  failure_scenarios_required: 2
  layer2_checks: [acceptance_criteria, scan_compliance, recitation_completeness, banned_token_scan, output_presence, failure_scenario_evaluation]
critical:
  layers: [1, 2, 3]
  retry_budget: 1
  council_size: 3
  operator_review_required: true
  failure_scenarios_required: 3
  layer2_checks: [acceptance_criteria, scan_compliance, recitation_completeness, banned_token_scan, output_presence, failure_scenario_evaluation]
default_risk_by_kind:
  audit: standard
  triage: elevated
  fix-plan: elevated
  implement: critical
  verify: elevated
auto_escalation_rules:
  - condition: "Task makes a destructive or bulk change."
    risk_level: critical
  - condition: "Task changes URLs or redirects."
    risk_level: critical
