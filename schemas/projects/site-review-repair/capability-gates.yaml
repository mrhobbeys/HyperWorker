# schemas/projects/site-review-repair/capability-gates.yaml
task_kinds:
  audit:
    description: "Crawling, inventorying, and diagnosing the site (read-only)."
    required_tools: [http_fetch, file_read, file_write]
    delivery_modes: [constrained]
  triage:
    description: "Prioritizing issues into a fix order."
    required_tools: [file_read, file_write]
    delivery_modes: [constrained]
  fix-plan:
    description: "Drafting proposed changes for operator approval."
    required_tools: [file_write]
    delivery_modes: [constrained, prescribed]
  implement:
    description: "Applying operator-approved fixes to the live site."
    required_tools: [file_write]
    delivery_modes: [prescribed]
  verify:
    description: "Re-fetching production to confirm fixes landed."
    required_tools: [http_fetch, file_read, file_write]
    delivery_modes: [prescribed]
scope_completeness:
  required: true
  allowed_terminal_states: [complete, deferred, excluded-after-discovery, escalated]
