# schemas/projects/opportunity-hunt/artifact-extensions.yaml
# Domain-specific artifact kinds and field extensions for channel
# opportunity-hunt projects.

# New artifact kinds introduced by this schema.

new_kinds:
  - kind: source
    description: |
      A monitored source: marketplace, cooperative purchasing portal, partner
      program portal, grant database/funder listing, aggregator, or
      association board. One source artifact per source. Created during
      00-registration-and-portal-inventory; access and registration status
      are updated as they change. Hash-citable.
    schema:
      - name: id
        type: string
        pattern: "SRC-\\d{3,}"
        required: true
      - name: title
        type: string
        required: true
        description: "Source / program / marketplace name."
      - name: url
        type: string
        required: true
      - name: source_type
        type: enum
        values: [marketplace, cooperative, partner-program, grant-program, aggregator, association, direct-outreach, other]
        required: true
      - name: access
        type: enum
        values: [open, registration-required, js-gated, login-gated]
        required: true
      - name: registration_status
        type: enum
        values: [not-registered, registered, pending, not-applicable]
        required: false
        default: not-applicable
      - name: cadence
        type: string
        required: false
        description: "How often to check this source (e.g., weekly, 2x-week). Defaults to OR-001 cadence."
      - name: weight
        type: enum
        values: [primary, secondary, contextual]
        required: true
        default: secondary
        description: "Official/primary sources are primary for deadline/figure verification; aggregators are secondary."
      - name: hash
        type: string
        required: true
        description: "Content hash at registration time. Citation freshness check uses this."
      - name: tags
        type: list[string]
        required: false

# Extensions to default artifact kinds.

finding:
  # Each discovered opportunity is a Finding.
  additional_fields:
    - name: from_source
      type: string
      required: true
      description: "[SRC-NNN#hash] of the source/listing where the opportunity was found."
    - name: listing_url
      type: string
      required: true
    - name: issuer
      type: string
      required: true
      description: "Buyer / program / partner entity issuing or owning the opportunity."
    - name: opportunity_identifier
      type: string|null
      required: false
      description: "RFP/listing/program ID if the source assigns one. Marked 'unconfirmed' until verified against the official/primary source."
    - name: response_deadline
      type: iso8601-date|null
      required: false
      description: "Marked 'unconfirmed' until verified. Must be after today for open status."
    - name: opportunity_status
      type: enum
      values: [pursuing, watch, excluded, excluded-after-discovery]
      required: true
      description: "Set during qualification; excluded statuses carry a reason."
    - name: eligibility_flag
      type: string|null
      required: false
      description: "Gate blocking pursuit, if any (e.g., 'blocked: co-op vendor award', 'blocked: partner enrollment', 'teaming/sub required')."
    - name: fit_rationale
      type: string
      required: true

decision:
  additional_fields:
    - name: pursuit_role
      type: enum|null
      values: [pursue-skip, scope-decision, weighting-rule, teaming-decision]
      required: false
      description: "What role this decision plays in the pursuit pipeline. Null if a general decision."
    - name: opportunity
      type: string|null
      required: false
      description: "[F-NNN#hash] of the opportunity this decision covers."

anti-pattern:
  additional_fields:
    - name: wasted_effort_pattern
      type: string|null
      required: false
      description: "The recurring dead-end this anti-pattern captures (e.g., a category of listing that is always out of channel)."

operating-reality:
  # Base operating-reality fields (budget, timeline, team, authority,
  # operator_profile) are not asked by opportunity-hunt bootstrap_questions.
  # Channel, offering, buyers, geography, eligibility gates, and cadence carry
  # the constraint set. Override the base template's required: true to make
  # them optional for opportunity-hunt projects.
  field_overrides:
    - name: budget
      required: false
    - name: timeline
      required: false
    - name: team
      required: false
    - name: authority
      required: false
    - name: operator_profile
      required: false
  additional_fields:
    - name: channel
      type: string
      required: true
      description: "Channel type: commercial-direct | cooperative-contracts | channel-partner | grants-funding."
    - name: what_we_sell
      type: string
      required: true
      description: "Which of your services/brands are sold through this channel."
    - name: target_buyers
      type: string
      required: true
      description: "Who the buyers/targets are in this channel."
    - name: eligibility_gates
      type: object
      required: true
      description: "Memberships/registrations/certs/enrollments that gate this channel (co-op vendor awards, partner enrollments, grant rules), with honest not-done status."
    - name: geographies
      type: list[string]
      required: true
    - name: subcontracting
      type: string|null
      required: false
      description: "Whether capability/geography gaps can be covered by a partner."
    - name: deliverable_path
      type: string
      required: true
      description: "Where this channel's running opportunity tracker lives."
    - name: cadence
      type: string
      required: false
      default: weekly
