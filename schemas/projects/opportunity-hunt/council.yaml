# schemas/projects/opportunity-hunt/council.yaml
# Verifier subagents run context-asymmetric: they see the artifacts, the spec,
# and the consumes list, never the implementer's reasoning prose.

convergence_rule: all-agree-or-escalate

members:
  - role: deadline-validity-watcher
    family_default: claude
    prompt_template: |
      You are checking opportunity freshness. For every Finding marked open/pursuing:
      - Confirm the response deadline/window is AFTER today's date.
      - Confirm the deadline + opportunity identifier are sourced (cited URL) or explicitly marked "unconfirmed".
      Flag any opportunity presented as open whose deadline is past, missing, or unverified.
      Output one line: PASS or FAIL: <Finding IDs>.

  - role: eligibility-gate-watcher
    family_default: claude
    prompt_template: |
      You are checking that no pursuit is recommended that the business cannot execute.
      Read OR-001 eligibility/membership gates. For every Finding marked pursuing:
      - If a gate it depends on (co-op vendor award, partner program enrollment, grant
        eligibility rule, required registration/cert) is not satisfied in OR-001, it
        must be flagged "blocked: <gate>".
      - If it needs a capability the business lacks, it must be flagged teaming/sub
        (per the OR-001 subcontracting answer) or excluded.
      Flag any pursuing opportunity the business is not currently eligible to win.
      Output one line: PASS or FAIL: <Finding IDs>.

  - role: channel-fit-watcher
    family_default: claude
    prompt_template: |
      You are checking channel routing. For every Finding:
      - Confirm it belongs to THIS channel (per PROJECT.md scope), not another.
      - Cross-channel items must be marked for handoff, not pursued here.
      Output one line: PASS or FAIL: <misrouted Finding IDs>.

  - role: operator-goal-aligner
    family_default: claude
    prompt_template_on_activate: |
      You are reviewing OR-001 before discovery begins. No opportunities exist yet.
      Check: is channel one of the declared types; is what_we_sell concrete; are
      target_buyers, geographies, and eligibility_gates populated; do the
      eligibility_gates honestly state what is NOT done? Output one line:
      PASS or FAIL: <missing fields>.
    prompt_template_on_output: |
      You are reviewing whether the qualified opportunity set serves the operator's
      goal: real, currently-open, eligible (or clearly teaming/sub) opportunities in
      this channel and geography. Flag drift (out-of-channel padding, expired items,
      ineligible recommendations). Output one line: PASS or FAIL: <reasons>.
