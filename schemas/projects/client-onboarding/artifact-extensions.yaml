# schemas/projects/client-onboarding/artifact-extensions.yaml

decision:
  additional_fields:
    - name: integration
      type: enum
      values: [sso, payments, crm, billing, data-import, support-tooling, cross-integration]
      required: false
    - name: requires_client_action
      type: bool
      required: false
      default: false

finding:
  additional_fields:
    - name: integration
      type: string|null
      required: false
    - name: client_specific
      type: bool
      required: true
      description: "If true, default scope is this client only. If false, candidate for cross-project promotion."

anti-pattern:
  additional_fields:
    - name: integration
      type: string|null
      required: false
    - name: vendor_quirk
      type: string|null
      required: false
      description: "If this anti-pattern is specific to a vendor's behavior, name the vendor."

operating-reality:
  # v5.1 field reconciliation. Client-onboarding always has authority (who signs
  # off on data migrations and SLA changes) and team (cross-functional —
  # vendor + client + sometimes a third-party integrator). contact_info is
  # required because there are multiple parties (vendor + client). Budget is
  # typically already in the SOW, so it is optional. operator_profile is often
  # "vendor-onboarding-lead" or similar, but not load-bearing if the role is
  # implied by the schema.
  field_overrides:
    - name: budget
      required: false
    - name: operator_profile
      required: false
  additional_fields:
    - name: contact_info
      type: object
      required: true
      description: "Required: client onboarding involves multiple parties (vendor + client) and contact details must be on file."
      fields:
        - name: vendor_legal_name
          type: string
          required: true
        - name: vendor_contact_email
          type: string
          required: true
        - name: client_legal_name
          type: string
          required: true
    - name: client_compliance_scope
      type: list[string]
      required: true
      description: "Compliance frameworks that govern this onboarding."
    - name: contract_sla_days
      type: number
      required: true
    - name: client_designated_contact
      type: object
      required: true
      fields:
        - name: name
          type: string
          required: true
        - name: email
          type: string
          required: true
