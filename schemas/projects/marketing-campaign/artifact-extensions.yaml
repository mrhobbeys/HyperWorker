# schemas/projects/marketing-campaign/artifact-extensions.yaml
# Domain-specific fields that extend the default artifact schemas for marketing-campaign projects.

decision:
  additional_fields:
    - name: channel
      type: enum
      values: [landing-page, email, social, paid-ad, sms, cross-channel]
      required: false
      description: "Which channel this decision applies to. Cross-channel decisions affect multiple."
    - name: target_segment
      type: string
      required: false
      description: "Audience segment (or 'all') the decision targets."

finding:
  additional_fields:
    - name: channel
      type: enum
      values: [landing-page, email, social, paid-ad, sms, cross-channel]
      required: false
    - name: replication_steps
      type: string
      required: false
      description: "How another agent could reproduce this finding (e.g., re-run the survey, re-measure CTR)."
    - name: sample_size
      type: number|null
      required: false

anti-pattern:
  additional_fields:
    - name: channel
      type: enum
      values: [landing-page, email, social, paid-ad, sms, cross-channel]
      required: false

operating-reality:
  # v5.1 field reconciliation. Marketing-campaign work always has timeline (the
  # campaign go-live), authority (who approves campaign assets for publish), and
  # contact_info (CAN-SPAM). Budget is sometimes implicit in a parent program's
  # SOW; team is often a single operator + reviewer pair. Mark budget, team,
  # operator_profile optional for this schema.
  field_overrides:
    - name: budget
      required: false
    - name: team
      required: false
    - name: operator_profile
      required: false
  additional_fields:
    # brand_voice_anchor accepts either a single string (v5.0.1 form) or a list
    # of strings (v5.1 form) or null. The harness normalizes a string value to a
    # single-element list internally before applying the multi-source composition
    # rule below. Dual-form acceptance is a transition mechanism so v5.0.1
    # marketing-campaign projects with a single-string anchor validate unchanged
    # under v5.1; future major versions may tighten to list-only after sufficient
    # adoption signal.
    - name: brand_voice_anchor
      type: string|list[string]|null
      required: false
      description: |
        Accepts a single string path/citation (v5.0.1 form) or a list (v5.1
        form). The harness normalizes string values to a single-element list
        internally. Operators may migrate to list form at their pace; both are
        valid through v5.1.x.

        Voice anchors compose in operator-declared priority order. The first
        entry dominates on conflict; later entries narrow or extend. Each entry
        is either a path to a brand voice document, a [F-NNN#hash] citation to
        a finding-encoded voice description, or a [DEC-NNN#hash] citing a
        voice decision. Use null for no anchors declared. The v5.0 type was
        string|null; v5.1 widens to support multi-source compositions (e.g., a
        competitor-tone analysis + an operator's voice doc + a brand guide)
        that the FL-009 lead-magnet run identified as load-bearing. A
        single-string value behaves identically to a single-element list — no
        composition is performed because there is nothing to compose.
    - name: contact_info
      type: object
      required: true
      fields:
        - name: physical_address
          type: string
          required: true
          description: "Required for CAN-SPAM compliance in email."
        - name: company_legal_name
          type: string
          required: true
        - name: email
          type: string
          required: true
