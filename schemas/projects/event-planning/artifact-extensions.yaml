# schemas/projects/event-planning/artifact-extensions.yaml

decision:
  additional_fields:
    - name: vendor
      type: string|null
      required: false
    - name: deposit_amount
      type: number|null
      required: false
    - name: cancellation_deadline
      type: iso8601-date|null
      required: false

finding:
  additional_fields:
    - name: venue
      type: string|null
      required: false
    - name: vendor
      type: string|null
      required: false

anti-pattern:
  additional_fields:
    - name: venue
      type: string|null
      required: false
      description: "If this anti-pattern is venue-specific, name the venue."
    - name: vendor
      type: string|null
      required: false

operating-reality:
  # v5.1 field reconciliation. Event planning always has timeline (the event
  # date — Tier 1 enforces this), team (vendor / staff coordination), and
  # budget (event production is budget-bound). authority is typically the
  # operator unless the operator coordinates a stakeholder organization.
  # operator_profile is venue-bound or virtual-event-bound; if the format is
  # virtual, the venue dimension does not apply, so operator_profile becomes
  # less load-bearing — make it optional.
  field_overrides:
    - name: authority
      required: false
    - name: operator_profile
      required: false
  additional_fields:
    - name: event_date
      type: iso8601-date
      required: true
    - name: target_headcount
      type: number
      required: true
    - name: format
      type: enum
      values: [in-person, hybrid, virtual]
      required: true
