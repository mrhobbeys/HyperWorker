# schemas/projects/compliance-audit/precedence-tiers.yaml

tiers:
  1:
    name: REGULATORY
    purpose: "Framework requirements. Cannot be overridden."
    examples:
      - "All controls must meet the specific framework's requirements (cite criterion / clause)."
      - "Evidence must be independently verifiable."
      - "Auditor communications go through the designated contact only."
      - "No fabricated, simulated, or backdated evidence."
    scan_markers:
      - "@@SCAN_1_1: Name the framework criterion / clause this task's output supports."
      - "@@SCAN_1_2: Confirm the evidence is from production (not staging) and is system-generated, not screenshot."

  2:
    name: AUDIT-SCOPE
    purpose: "What is in scope for this cycle."
    examples:
      - "Only prepare evidence for controls in the confirmed audit scope."
      - "Do not remediate out-of-scope items during this project."
      - "Scope changes require operator approval and a new DEC-XXX."
    scan_markers:
      - "@@SCAN_2_1: Cite the AUDIT-SCOPE line that places this control in scope."

  3:
    name: TECHNICAL
    purpose: "Evidence and remediation technical constraints."
    examples:
      - "Evidence from production systems only."
      - "Reports include date ranges matching the audit period."
      - "Access logs must be tamper-evident."
    scan_markers:
      - "@@SCAN_3_1: State the audit period date range and confirm evidence falls within it."

  4:
    name: DOCUMENTATION
    purpose: "Documentation hygiene."
    examples:
      - "Follow the organization's policy template format."
      - "Consistent naming conventions for evidence files."
      - "Include revision history on all policies."

banned_tokens:
  - banned: "approximately"
    replacement: "<exact value>"
    tier: 1
    why: "Audit evidence requires precise values."
  - banned: "should be"
    replacement: "is"
    tier: 1
    why: "Hedging language in audit evidence triggers auditor follow-up."
