# Ceremony-cost sweep — qwen3-4b-thinking (heavy reasoning layer).
# Pairs with ceremony-cost-gptoss20b.yaml: same task, prompts, axes, and checks;
# only the model differs. The comparison isolates the thinking layer — a small 4B
# with reasoning vs. a larger 20B with almost none. Results land in
# results/ceremony-cost-qwen4b/.
#
# n is reduced to 2 (gpt-oss ran at n=5) because the 4B is latency-bound on CPU:
# a single warm harness-step call is ~185s with 91% of completion tokens spent on
# reasoning, and per-turn latency grows with the multi-turn context. The full
# protocol (~12 turns) can exceed the per-call timeout on later turns; an INVALID
# there is the latency finding, not a config error. The checks are near-
# deterministic, so within-cell variance is low even at n=2.

finch: 1
name: ceremony-cost-qwen4b
mode: one-at-a-time
trials_per_cell: 2

endpoint:
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3-4b-thinking-2507"
  api_key: null

params:
  temperature: 0.2
  max_tokens: 4096                   # thinking needs headroom or it truncates before the tool call
  seed: 42

budget:
  max_turns: 14
  max_seconds_per_trial: 900         # per-call timeout; the 4B is slow on CPU (~185s+/call, grows with context)

tools: hyperworker

task:
  prompt_file: ceremony-lightweight.md
  inputs:
    topic: "Event-sourced state beats mutable files for multi-writer agent work"

axes:
  - id: prompt
    target: prompt_file
    levels: ["ceremony-full.md", "ceremony-none.md"]

scoring:
  structural: auto
  checks:
    - {id: completed,    type: structural, metric: task_complete,                  min: 1, weight: 3.0}
    - {id: activated,    type: structural, metric: "kind:project.activate",        min: 1, weight: 1.0}
    - {id: scope_locked, type: structural, metric: "kind:bootstrap.scope_locked",  min: 1, weight: 1.0}
    - {id: clean_layer1, type: structural, metric: layer1_fail,                    max: 0, weight: 1.0}
