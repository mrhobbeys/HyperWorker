# Ceremony-cost sweep — MOCK dry-run.
#
# This validates the v0.2 tool-call machinery end to end without a model: the
# built-in `mock` endpoint emits a deterministic tool-call sequence (a minimal
# bootstrap), the loop executes the hyperworker tools, events.jsonl is written,
# structural metrics are computed, structural checks score, and the leaderboard
# renders with per-cell token medians.
#
# The mock responder ignores the prompt, so all three ceremony cells behave
# identically here — the leaderboard correctly reports "no detected difference."
# The actual ceremony-cost finding requires a live model: see ceremony-cost-plan.yaml.

finch: 1
name: ceremony-cost-mock
mode: one-at-a-time
trials_per_cell: 3

endpoint:
  base_url: "mock"
  model: "mock"

params:
  temperature: 0.2
  max_tokens: 1024

budget:
  max_turns: 8                      # the tool loop needs several turns to bootstrap
  max_seconds_per_trial: 60

tools: hyperworker                  # enable the v0.2 tool-call loop + built-in toolset

task:
  prompt_file: ceremony-lightweight.md   # baseline cell == the lightweight ceremony level
  inputs:
    topic: "Event-sourced state beats mutable files for multi-writer agent work"

axes:
  - id: prompt                      # the ceremony level under test
    target: prompt_file
    levels: ["ceremony-full.md", "ceremony-none.md"]

scoring:
  structural: auto
  checks:
    - {id: activated,     type: structural, metric: "kind:project.activate", min: 1, weight: 1.0}
    - {id: completed,     type: structural, metric: task_complete,           min: 1, weight: 3.0}
    - {id: clean_layer1,  type: structural, metric: layer1_fail,             max: 0, weight: 1.0}
