# HyperFinch flight plan — copy, fill in, run: python finch.py run <this-file>
# Full field reference: FINCH.md §Flight plan schema

finch: 1
name: my-first-sweep              # results land in results/<name>/
mode: one-at-a-time               # one-at-a-time | factorial (factorial explodes; opt in knowingly)
trials_per_cell: 5                # 5-10 detects large effects only; the leaderboard says so

endpoint:
  base_url: "http://localhost:11434/v1"   # Ollama default; any OpenAI-compatible server; "mock" to dry-run
  model: "llama3.1:8b"
  api_key: null                   # or "$ENV_VAR_NAME"

params:
  temperature: 0.7
  max_tokens: 1024
  seed: 42                        # passed through; many local backends ignore it

budget:
  max_turns: 1                    # >1 enables the bounded agentic loop (file-block or tool-call)
  max_seconds_per_trial: 120

# tools: hyperworker              # v0.2: enable the OpenAI tool-call loop + built-in harness
#                                 # toolset (hw_append_event computes the hash chain for the
#                                 # model). Omit for the v0.1 file-block loop. See FINCH.md
#                                 # §Tool-Call Loop. Needs max_turns > 1.

workspace:
  copy: []                        # e.g. ["../HyperWorker"] to give each trial a fresh harness checkout

task:
  prompt_file: task-prompt.md     # {{key}} placeholders substituted from inputs
  inputs:
    tone: "direct"

axes:
  # Vary a task input:
  - id: tone
    target: input
    key: tone
    levels: ["direct", "playful"]
  # Vary a sampling parameter:
  # - id: temperature
  #   target: param
  #   key: temperature
  #   levels: [0.2, 0.9]
  # Swap the whole prompt:
  # - id: prompt
  #   target: prompt_file
  #   levels: ["task-prompt.md", "task-prompt-v2.md"]

scoring:
  checks:
    - {id: has_subject, type: regex,          pattern: "^Subject:",  weight: 2.0}
    - {id: short,       type: word_count_max, value: 300,            weight: 1.0}
    - {id: no_hype,     type: not_contains,   pattern: "guaranteed", weight: 1.0}
    # v0.2 structural check: score a metric off the trial's events.jsonl.
    # metric ∈ {events, layer1_fail, layer2_fail, task_complete, council_escalated,
    #           recite_reject} or "kind:<event.kind>"; tested against min/max/equals.
    # - {id: completed, type: structural, metric: task_complete, min: 1, weight: 3.0}
  structural: auto                # auto | off — HyperWorker events.jsonl metrics when present
  judge: null                     # reserved for v0.3 (paired-comparison judging)
